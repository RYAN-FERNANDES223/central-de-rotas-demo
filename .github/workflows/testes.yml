name: Testes do bot

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Conferir sintaxe de todos os arquivos
        run: python -m compileall -q .
      - name: Rodar testes do bot e banco
        run: python -m unittest discover -s tests -v
